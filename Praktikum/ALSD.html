<script>
const R=String.raw;
const B=(t,d,k,p,run=true)=>({t,d,k,p,run});
const S=[];

/* ============ MODUL 1 ============ */
S.push({n:'1. Review Python',h:'Modul 1 - Review Python & Persiapan',s:'Instalasi, Jupyter, uv, lalu dasar Python yang dipakai di semua modul berikutnya.',
r:['<b>Python</b>: bahasa interpreted, sintaks rapi, ekosistem library besar (PyPI). Pakai Python 3.12 atau 3.13.','<b>pip</b> = pengelola paket (<code>pip install nama_library</code>). <b>Library</b> = kode siap pakai supaya tidak membuat ulang dari nol.','<b>Jupyter Notebook</b>: kode dipecah jadi <i>Cell</i> yang jalan sendiri-sendiri. <b>Shift+Enter</b> jalankan lalu pindah cell, <b>Ctrl+Enter</b> jalankan dan tetap, <b>Alt+Enter</b> jalankan lalu tambah cell. Versi online: Google Colab dan Kaggle.','<b>uv</b>: pengelola project + library, satu project satu folder supaya versi library tidak bentrok antar project.','<b>Struktur data</b> = cara mengorganisasi dan menyimpan data supaya mudah dicari, diubah, dan diproses. Pilihan yang tepat bikin program lebih cepat dan hemat memori.'],
b:[
B('Perintah pip & uv (di terminal, bukan di sini)','Ini dijalankan di Command Prompt / PowerShell, jadi hanya untuk dibaca.',R`python -V                  # cek versi Python
pip --version              # cek pip
pip install cowsay         # install library
pip install jupyter notebook
jupyter notebook           # buka Jupyter di localhost:8888

pip install uv             # install uv
uv init strukdat01         # buat project baru
uv add numpy pandas        # tambah library ke project
uv run main.py             # jalankan script
uv run jupyter notebook    # Jupyter di dalam project`,[['uv init nama','membuat folder project baru lengkap dengan pyproject.toml'],['uv add lib','memasang library hanya untuk project aktif (bukan global)'],['uv run file.py','menjalankan file memakai library milik project']],false),
B('Variabel dan tipe data','Variabel = kotak bernama untuk menyimpan nilai. Tipe data menentukan jenis nilainya.',R`nama = "Andi"      # str  (teks)
umur = 20          # int  (bilangan bulat)
nilai = 85.5       # float (desimal)
lulus = True       # bool (True/False)
print(nama, type(nama))
print(umur, type(umur))
print(nilai, type(nilai))
print(lulus, type(lulus))`,[['nama, umur, nilai, lulus','nama variabel (kotak) yang kamu buat sendiri'],['=','memasukkan nilai ke variabel (bukan "sama dengan")'],['type(x)','fungsi bawaan untuk melihat tipe data x']]),
B('Percabangan: if / elif / else / match-case','Python mengecek dari atas ke bawah, begitu ada kondisi True blok itu dijalankan dan sisanya dilewati.',R`nilai = 78
if nilai >= 85:
    grade = "A"
elif nilai >= 70:
    grade = "B"
elif nilai >= 55:
    grade = "C"
else:
    grade = "D"
print("Grade:", grade)

hari = 3
match hari:            # mirip switch-case
    case 1: print("Senin")
    case 2: print("Selasa")
    case 3: print("Rabu")
    case _: print("Hari lain")   # _ = default`,[['if / elif / else','pilih satu jalur dari beberapa kondisi'],['>=','operator perbandingan (lebih besar atau sama)'],['match / case _','mencocokkan satu nilai dengan beberapa kemungkinan; _ untuk "selain itu"'],['indentasi (4 spasi)','menandai isi blok; wajib di Python']]),
B('Perulangan: for, range, while, break, continue','for dipakai bila jumlah ulangan jelas, while selama kondisi True.',R`for i in range(1, 10, 2):      # start=1, stop=10 (tidak ikut), step=2
    print("for:", i)

n = 3
while n > 0:
    print("while:", n)
    n -= 1                      # tanpa ini jadi loop tak terbatas

for x in [1, 2, 3, 4, 5]:
    if x == 2:

    if x == 5:
        break                   # hentikan seluruh loop
    print("x =", x)`,[['range(start, stop, step)','deret angka dari start sampai sebelum stop'],['n -= 1','sama dengan n = n - 1'],['break','berhenti total dari loop'],['continue','lompat ke iterasi berikutnya']]),
B('Fungsi','Sekumpulan instruksi yang diberi nama supaya bisa dipakai ulang.',R`def sapa(nama, sapaan="Halo"):   # sapaan punya nilai default
    return f"{sapaan}, {nama}!"

print(sapa("Budi"))
print(sapa("Ani", "Hai"))`,[['def nama(parameter):','mendefinisikan fungsi'],['return','mengirim hasil keluar dari fungsi'],['f"...{x}..."','f-string: menyisipkan nilai variabel ke teks']])
]});

/* ============ MODUL 2 ============ */
S.push({n:'2. Big-O & Rekursif',h:'Modul 2 - Analisis Algoritma dan Fungsi Rekursif',s:'Mengukur seberapa cepat jumlah operasi tumbuh saat data bertambah, lalu belajar fungsi yang memanggil dirinya sendiri.',
r:['Dua algoritma yang hasilnya sama belum tentu sama efisien. Yang diukur bukan detik (tergantung komputer), tapi <b>pola pertumbuhan jumlah operasi</b> saat data (n) membesar.','<b>Big-O</b>: O(1) konstan, O(log n) logaritmik, O(n) linear, O(n log n), O(n²) kuadratik (loop bersarang), O(2ⁿ) eksponensial.','<b>Rekursif</b> = fungsi memanggil dirinya sendiri dengan masalah yang lebih kecil. Wajib punya <b>base case</b> (kondisi berhenti) dan <b>recursive case</b> (pemanggilan diri).','Iteratif vs rekursif: faktorial keduanya O(n); iteratif lebih hemat memori, rekursif lebih natural untuk masalah yang bisa dipecah (pohon, divide and conquer).'],
w:'wBigO',
b:[
B('Menghitung jumlah operasi tiap kompleksitas','Versi modul memakai pandas dan matplotlib; di sini dicetak sebagai tabel teks supaya bisa jalan di browser.',R`def konstan(data):
    return 1                       # O(1): ambil 1 data saja

def logaritmik(n):                 # O(log n): n dibagi 2 tiap putaran
    op = 0
    while n > 1:
        n = n // 2
        op += 1
    return op

def linear(data):                  # O(n)
    op = 0
    for _ in data:
        op += 1
    return op

def nlogn(data):                   # O(n log n)
    op = 0
    ukuran = len(data)
    while ukuran > 1:
        for _ in data:
            op += 1
        ukuran = ukuran // 2
    return op

def kuadratik(data):               # O(n^2): loop bersarang
    op = 0
    for i in data:
        for j in data:
            op += 1
    return op

def eksponensial(n, counter):      # O(2^n): memanggil diri 2 kali
    counter[0] += 1
    if n == 0:
        return
    eksponensial(n - 1, counter)
    eksponensial(n - 1, counter)

print(f"{'n':>4}{'O(1)':>6}{'logn':>6}{'O(n)':>6}{'nlogn':>7}{'n^2':>7}{'2^n':>8}")
for n in [1, 2, 3, 4, 5, 10, 15]:
    data = list(range(n))
    c = [0]
    eksponensial(n, c)
    print(f"{n:>4}{konstan(data):>6}{logaritmik(n):>6}{linear(data):>6}{nlogn(data):>7}{kuadratik(data):>7}{c[0]:>8}")`,[['operasi / op','penghitung berapa kali pekerjaan inti dilakukan'],['n // 2','pembagian bulat, membagi data jadi setengah'],['counter = [0]','list dipakai agar nilainya bisa diubah dari dalam fungsi rekursif'],['list(range(n))','membuat data [0,1,...,n-1]']]),
B('Rekursif: melihat alur masuk dan keluar','Fungsi tidak langsung selesai saat memanggil dirinya. Ia menumpuk dulu sampai base case, lalu kembali satu per satu.',R`def hitung_mundur(n):
    print("masuk  n =", n)
    if n == 0:                      # BASE CASE
        print("base case tercapai")
        return
    hitung_mundur(n - 1)            # RECURSIVE CASE (masalah lebih kecil)
    print("selesai n =", n)

hitung_mundur(3)`,[['if n == 0: return','base case: tanpa ini rekursi tak pernah berhenti (RecursionError)'],['hitung_mundur(n - 1)','recursive case: n harus mengecil menuju base case'],['output "selesai"','muncul terbalik (3 terakhir mulai, 1 duluan selesai) karena call stack']]),
B('Faktorial: rekursif vs iteratif','Keduanya O(n). Perhatikan base case dibuat n <= 1 agar faktorial(0) tidak error.',R`def faktorial_rekursif(n):
    if n <= 1:                      # base case
        return 1
    return n * faktorial_rekursif(n - 1)

def faktorial_iteratif(n):
    hasil = 1
    for i in range(1, n + 1):
        hasil *= i
    return hasil

print(faktorial_rekursif(5), faktorial_iteratif(5))
print(faktorial_rekursif(0))`,[['n * faktorial_rekursif(n - 1)','5! = 5 x 4! = 5 x 4 x 3! ... sampai 1'],['hasil','akumulator pada versi iteratif']]),
B('Latihan modul: kunci jawaban','Cetak n..1, jumlah 1..n, pangkat, dan Fibonacci secara rekursif.',R`def cetak(n):
    if n == 0: return
    print(n, end=" ")
    cetak(n - 1)

def jumlah(n):
    if n == 0: return 0
    return n + jumlah(n - 1)

def pangkat(a, b):                 # a pangkat b
    if b == 0: return 1
    return a * pangkat(a, b - 1)

def fib(n):
    if n < 2: return n             # fib(0)=0, fib(1)=1
    return fib(n - 1) + fib(n - 2)

cetak(5); print()
print(jumlah(10), pangkat(2, 8))
print([fib(i) for i in range(10)])`,[['fib(n-1) + fib(n-2)','memanggil diri 2 kali, jadi pertumbuhannya eksponensial (lihat O(2ⁿ))']])
]});

/* ============ MODUL 3 ============ */
S.push({n:'3. Sorting Iteratif',h:'Modul 3 - Algoritma Pengurutan: Iteratif',s:'Bubble, Selection, dan Insertion Sort. Mudah dipahami, semuanya O(n²).',
r:['<b>Sorting</b> = mengurutkan data (menaik/ascending atau menurun/descending) berdasarkan aturan tertentu.','<b>Selection Sort</b>: cari nilai terkecil dari bagian yang belum urut, taruh di depan. Pertukaran sedikit.','<b>Bubble Sort</b>: bandingkan dua tetangga, tukar jika salah urut; tiap putaran nilai terbesar "mengapung" ke ujung.','<b>Insertion Sort</b>: ambil satu elemen lalu sisipkan ke posisi yang pas di bagian yang sudah urut (seperti menyusun kartu). Bagus untuk data hampir urut.','Ketiganya O(n²), tidak in-place memori tambahan (tidak butuh memori ekstra), kurang cocok untuk data besar.'],
w:'wSort',
b:[
B('Tiga sorting pada data yang sama','Data dikopi dengan .copy() supaya data asli tidak rusak oleh fungsi sorting.',R`data = [64, 34, 25, 12, 22, 11, 90]

def selection_sort(arr):
    n = len(arr)
    for i in range(n - 1):               # posisi yang akan diisi
        min_index = i                    # anggap arr[i] terkecil
        for j in range(i + 1, n):        # cari yang lebih kecil
            if arr[j] < arr[min_index]:
                min_index = j
        arr[i], arr[min_index] = arr[min_index], arr[i]   # tukar
    return arr

def bubble_sort(arr):
    n = len(arr)
    for i in range(n - 1):               # jumlah putaran
        for j in range(n - i - 1):       # ujung kanan sudah beres, makin pendek
            if arr[j] > arr[j + 1]:
                arr[j], arr[j + 1] = arr[j + 1], arr[j]
    return arr

def insertion_sort(arr):
    n = len(arr)
    for i in range(1, n):
        key = arr[i]                     # elemen yang disisipkan
        j = i - 1
        while j >= 0 and arr[j] > key:   # geser yang lebih besar ke kanan
            arr[j + 1] = arr[j]
            j -= 1
        arr[j + 1] = key
    return arr

print("Selection:", selection_sort(data.copy()))
print("Bubble   :", bubble_sort(data.copy()))
print("Insertion:", insertion_sort(data.copy()))`,[['arr[i], arr[j] = arr[j], arr[i]','menukar dua nilai tanpa variabel bantu'],['min_index','posisi nilai terkecil sementara (Selection)'],['range(n - i - 1)','batas perbandingan Bubble menyusut karena ujung sudah urut'],['key','nilai yang sedang dicarikan tempat (Insertion)'],['data.copy()','salinan list, supaya list asli tetap']]),
B('Studi kasus toko online: sort list of dictionary','Algoritma sama, yang berubah hanya kunci pembandingnya: ["harga"], ["nama"], atau ["stok"].',R`produk = [
    {"nama": "Headset",   "harga": 150000, "stok": 12},
    {"nama": "Mouse",     "harga": 85000,  "stok": 25},
    {"nama": "Keyboard",  "harga": 250000, "stok": 8},
    {"nama": "Webcam",    "harga": 200000, "stok": 15},
    {"nama": "Flashdisk", "harga": 75000,  "stok": 30},
]

def bubble_harga(p):                      # termurah -> termahal
    n = len(p)
    for i in range(n - 1):
        for j in range(n - i - 1):
            if p[j]["harga"] > p[j + 1]["harga"]:
                p[j], p[j + 1] = p[j + 1], p[j]
    return p

def selection_nama(p):                    # A -> Z
    n = len(p)
    for i in range(n - 1):
        m = i
        for j in range(i + 1, n):
            if p[j]["nama"] < p[m]["nama"]:
                m = j
        p[i], p[m] = p[m], p[i]
    return p

def insertion_stok(p):                    # stok terbanyak -> tersedikit
    for i in range(1, len(p)):
        key = p[i]
        j = i - 1
        while j >= 0 and p[j]["stok"] < key["stok"]:   # tanda < = menurun
            p[j + 1] = p[j]
            j -= 1
        p[j + 1] = key
    return p

print("Harga :", [(x["nama"], x["harga"]) for x in bubble_harga(produk.copy())])
print("Nama  :", [x["nama"] for x in selection_nama(produk.copy())])
print("Stok  :", [(x["nama"], x["stok"]) for x in insertion_stok(produk.copy())])`,[['produk[j]["harga"]','ambil nilai kunci "harga" dari dictionary ke-j'],['> atau <','membalik tanda perbandingan = membalik arah urutan (latihan modul)'],['[... for x in ...]','list comprehension, membuat list baru ringkas']])
]});

/* ============ MODUL 4 ============ */
S.push({n:'4. Merge & Quick Sort',h:'Modul 4 - Sorting Divide and Conquer',s:'Dua algoritma efisien yang memakai rekursi: Merge Sort dan Quick Sort.',
r:['<b>Divide and Conquer</b>: Divide (bagi masalah) → Conquer (selesaikan sub-masalah, rekursif) → Combine (gabungkan).','<b>Merge Sort</b>: bagi array di tengah sampai 1 elemen, lalu gabung (merge) sambil membandingkan. Selalu O(n log n), memori O(n), <b>stabil</b>.','<b>Quick Sort</b>: pilih <b>pivot</b>, pecah jadi kiri (&lt; pivot) dan kanan (≥ pivot), urutkan keduanya rekursif. Rata-rata O(n log n), terburuk O(n²) jika pivot selalu ekstrem; tidak stabil.'],
w:'wSort',
b:[
B('Merge Sort dengan jejak proses','Jalankan dan baca baris "Divide" untuk melihat pembagian, hasil akhir muncul setelah merge.',R`def merge(left, right):
    result = []
    i = 0                                  # penunjuk di left
    j = 0                                  # penunjuk di right
    while i < len(left) and j < len(right):
        if left[i] < right[j]:
            result.append(left[i]); i += 1
        else:
            result.append(right[j]); j += 1
    result.extend(left[i:])                # sisa yang belum terambil
    result.extend(right[j:])
    return result

def merge_sort(arr):
    print("Divide:", arr)
    if len(arr) <= 1:                      # BASE CASE
        return arr
    mid = len(arr) // 2
    left = merge_sort(arr[:mid])           # RECURSIVE CASE
    right = merge_sort(arr[mid:])
    hasil = merge(left, right)
    print("Merge :", left, "+", right, "=", hasil)
    return hasil

data = [38, 12, 27, 43, 9, 31, 18, 25]
print("Akhir:", merge_sort(data.copy()))`,[['mid = len(arr) // 2','titik tengah pembagian'],['arr[:mid], arr[mid:]','slicing: separuh kiri dan separuh kanan'],['merge(left, right)','menggabung dua list yang SUDAH urut jadi satu urut'],['i, j','penunjuk posisi di left dan right, maju sesuai yang diambil']]),
B('Quick Sort dengan jejak proses','Pivot = elemen terakhir. Gabungan akhirnya selalu: kiri + [pivot] + kanan.',R`def quick_sort(arr):
    print("Data :", arr)
    if len(arr) <= 1:                      # BASE CASE
        return arr
    pivot = arr[-1]                        # elemen terakhir
    left, right = [], []
    for x in arr[:-1]:                     # semua kecuali pivot
        if x < pivot:
            left.append(x)
        else:
            right.append(x)
    print("  Left:", left, "Pivot:", pivot, "Right:", right)
    return quick_sort(left) + [pivot] + quick_sort(right)

data = [38, 12, 27, 43, 9, 31, 18, 25]
print("Akhir:", quick_sort(data.copy()))`,[['pivot = arr[-1]','indeks -1 = elemen terakhir'],['left / right','wadah elemen lebih kecil dan lebih besar/sama dari pivot'],['quick_sort(left) + [pivot] + quick_sort(right)','recursive case + combine']]),
B('Studi kasus perpustakaan','Merge Sort untuk judul (A-Z), Quick Sort untuk tahun terbit.',R`buku = [
    {"judul": "Algoritma Pemrograman", "tahun": 2022, "penulis": "Andi Wijaya"},
    {"judul": "Basis Data", "tahun": 2020, "penulis": "Andi Wijaya"},
    {"judul": "Pemrograman Python", "tahun": 2023, "penulis": "Tono Pratama"},
    {"judul": "Struktur Data", "tahun": 2021, "penulis": "Rina Putri"},
    {"judul": "Jaringan Komputer", "tahun": 2019, "penulis": "Andi Wijaya"},
    {"judul": "Rekayasa Perangkat Lunak", "tahun": 2022, "penulis": "Deni Kurniawan"},
    {"judul": "Sistem Operasi", "tahun": 2020, "penulis": "Maya Sari"},
    {"judul": "Kecerdasan Buatan", "tahun": 2024, "penulis": "Tono Pratama"},
]

def merge(left, right):
    result, i, j = [], 0, 0
    while i < len(left) and j < len(right):
        if left[i]["judul"] < right[j]["judul"]:
            result.append(left[i]); i += 1
        else:
            result.append(right[j]); j += 1
    return result + left[i:] + right[j:]

def merge_sort(b):
    if len(b) <= 1: return b
    mid = len(b) // 2
    return merge(merge_sort(b[:mid]), merge_sort(b[mid:]))

def quick_sort(b):
    if len(b) <= 1: return b
    pivot = b[-1]
    left  = [x for x in b[:-1] if x["tahun"] <  pivot["tahun"]]
    right = [x for x in b[:-1] if x["tahun"] >= pivot["tahun"]]
    return quick_sort(left) + [pivot] + quick_sort(right)

print("== Judul A-Z (Merge) ==")
for x in merge_sort(buku): print(f'{x["judul"]:<28}{x["penulis"]:<16}{x["tahun"]}')
print("== Tahun terlama (Quick) ==")
for x in quick_sort(buku): print(f'{x["tahun"]}  {x["judul"]}')`,[['b[:-1]','semua elemen kecuali yang terakhir (pivot)'],['f\'{x:<28}\'','f-string dengan lebar 28 rata kiri, supaya kolom rapi'],['x["tahun"] < pivot["tahun"]','kriteria urut; ganti sesuai kebutuhan latihan']]),

def cetak_dict(d, tab=0):            # telusuri dictionary bersarang
    for k, v in d.items():
        if isinstance(v, dict):
            print("  " * tab + str(k) + ":")
            cetak_dict(v, tab + 1)   # masuk lapis lebih dalam
        else:
            print("  " * tab + f"{k} = {v}")
cetak_dict({"a": 1, "b": {"c": 2, "d": {"e": 3}}})

def kedalaman(x):
    if not isinstance(x, list): return 0
    return 1 + max([kedalaman(i) for i in x], default=0)
print(kedalaman([1, [2, [3]]]))      # 3`,[['isinstance(x, list)','cek tipe: list atau bukan'],['base case','isi sudah bukan wadah (angka), berhenti'],['recursive case','isi masih wadah, panggil diri untuk tiap anak'],['tab + 1','menandai kedalaman supaya tercetak menjorok']])
]});

/* ============ RENDER ============ */
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let py=null;
function loadPy(){return new Promise((ok,no)=>{if(window.loadPyodide)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=ok;s.onerror=()=>no(new Error('Gagal memuat Python di browser. Pastikan internet aktif.'));document.head.appendChild(s)})}
async function run(code,out,st){out.className='out';out.textContent='';let buf='';
 try{if(!py){st.textContent='Memuat Python (sekali saja, ~10 MB)...';await loadPy();py=await loadPyodide();}
  st.textContent='Berjalan...';py.setStdout({batched:s=>buf+=s+'\n'});py.setStderr({batched:s=>buf+=s+'\n'});
  const g=py.toPy({});await py.runPythonAsync(code,{globals:g});g.destroy();out.textContent=buf||'(selesai, tidak ada output)';st.textContent='';}
 catch(e){out.className='out err';out.textContent=buf+String(e.message||e).split('\n').slice(-8).join('\n');st.textContent='';}}
function cell(b){const d=document.createElement('div');d.className='cell';const ta=document.createElement('textarea');ta.value=b.k;ta.spellcheck=false;ta.rows=Math.min(b.k.split('\n').length+1,26);
 ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end')}};
 d.appendChild(ta);const bar=document.createElement('div');bar.className='bar';
 if(b.run){const o=document.createElement('pre');const st=document.createElement('span');const r=document.createElement('button');r.textContent='Jalankan';r.onclick=()=>run(ta.value,o,st);const rs=document.createElement('button');rs.className='g';rs.textContent='Reset kode';rs.onclick=()=>{ta.value=b.k;o.textContent=''};bar.append(r,rs,st);d.append(ta,bar,o);o.className='out'}
 else{bar.innerHTML='<span>Kode Streamlit / terminal: dijalankan di komputer sendiri, bukan di browser.</span>';d.append(bar)}
 return d}
function block(b){const f=document.createDocumentFragment();const h=document.createElement('h3');h.textContent=b.t;const p=document.createElement('p');p.className='sub';p.innerHTML=b.d;f.append(h,p,cell(b));
 if(b.p&&b.p.length){const t=document.createElement('table');t.innerHTML='<tr><th>Bagian / variabel</th><th>Artinya</th></tr>'+b.p.map(x=>`<tr><td><code>${esc(x[0])}</code></td><td>${x[1]}</td></tr>`).join('');f.append(t)}return f}
function show(i){const m=S[i];document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));const M=$('#main');M.innerHTML=`<h2>${m.h}</h2><p class="sub">${m.s}</p><h3>Ringkasan</h3><ul>${m.r.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 if(m.w){const w=document.createElement('div');w.className='box';M.append(w);W[m.w](w)}
 M.append(...m.b.map(block));scrollTo(0,0);location.hash=i}
S.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.n;b.onclick=()=>show(i);$('#nav').append(b)});

/* ============ WIDGET INTERAKTIF ============ */
const W={};
W.wBigO=el=>{el.innerHTML=`<b>Simulator pertumbuhan operasi</b><div class="row">n = <input type="range" id="bn" min="1" max="30" value="10"> <b id="bv">10</b></div><table id="bt"></table><small>Perhatikan O(2ⁿ) melonjak, sementara O(log n) hampir diam.</small>`;
 const f=()=>{const n=+el.querySelector('#bn').value;el.querySelector('#bv').textContent=n;const L=Math.log2(n),rows=[['O(1)',1],['O(log n)',Math.floor(L)],['O(n)',n],['O(n log n)',Math.round(n*L)],['O(n²)',n*n],['O(2ⁿ)',2**n]];
 el.querySelector('#bt').innerHTML='<tr><th>Kompleksitas</th><th>Operasi</th><th>Relatif ke O(n)</th></tr>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1].toLocaleString('id-ID')}</td><td><div style="height:8px;background:var(--acc);width:${Math.min(100,Math.max(1,r[1]/Math.max(n,1)*10))}%"></div></td></tr>`).join('')};
 el.querySelector('#bn').oninput=f;f()};
W.wSort=el=>{el.innerHTML=`<b>Visualisasi sorting langkah demi langkah</b><div class="row"><select id="sa"><option value="bubble">Bubble</option><option value="selection">Selection</option><option value="insertion">Insertion</option></select><button class="btn g" id="sr">Acak data</button><button class="btn" id="sp">Mulai otomatis</button><button class="btn g" id="sn">Langkah berikut</button><span id="ss"></span></div><div class="bars" id="sb"></div><small>Biru = sedang dibandingkan/digeser, hijau = selesai. Untuk Merge dan Quick lihat jejak "Divide/Pivot" pada kode di bawah.</small>`;
 const q=s=>el.querySelector(s);let A=[],T=[],k=0,tm=null;
 const steps=(al,a)=>{a=[...a];const Z=[{a:[...a],h:[]}],n=a.length,p=h=>Z.push({a:[...a],h});
  if(al=='bubble'){for(let i=0;i<n-1;i++)for(let j=0;j<n-i-1;j++){p([j,j+1]);if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];p([j,j+1])}}}
  else if(al=='selection'){for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){p([m,j]);if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];p([i,m])}}
  else{for(let i=1;i<n;i++){const key=a[i];let j=i-1;while(j>=0&&a[j]>key){a[j+1]=a[j];j--;p([j+1,i])}a[j+1]=key;p([j+1])}}
  Z.push({a:[...a],h:[],d:1});return Z};
 const draw=()=>{const s=T[k];q('#sb').innerHTML=s.a.map((v,i)=>`<div class="${s.d?'d':s.h.includes(i)?'h':''}" style="height:${v*1.6}px">${v}</div>`).join('');q('#ss').textContent=`langkah ${k+1}/${T.length}`};
 const init=()=>{clearInterval(tm);q('#sp').textContent='Mulai otomatis';T=steps(q('#sa').value,A);k=0;draw()};
 const rnd=()=>{A=Array.from({length:9},()=>5+Math.floor(Math.random()*90));init()};
 q('#sr').onclick=rnd;q('#sa').onchange=init;q('#sn').onclick=()=>{if(k<T.length-1){k++;draw()}};
 q('#sp').onclick=()=>{if(tm&&q('#sp').textContent=='Jeda'){clearInterval(tm);q('#sp').textContent='Mulai otomatis';return}if(k>=T.length-1)init();q('#sp').textContent='Jeda';tm=setInterval(()=>{if(k<T.length-1){k++;draw()}else{clearInterval(tm);q('#sp').textContent='Mulai otomatis'}},350)};
 A=[64,34,25,12,22,11,90];init()};
W.wDapen=el=>{el.innerHTML=`<b>Simulator Kalkulator Dana Pensiun (meniru app Streamlit)</b><div class="row">Usia sekarang <input id="d1" type="number" value="19" style="width:70px"> Usia pensiun <input id="d2" type="number" value="55" style="width:70px"> Dana awal <input id="d3" type="number" value="0" style="width:110px"></div><div class="row">Iuran bulanan <input id="d4" type="number" value="1000000" style="width:110px"> Imbal hasil % <input id="d5" type="number" value="5" step="0.5" style="width:70px"> <button class="btn" id="d6">Hitung!</button></div><div id="d7"></div>`;
 const q=s=>el.querySelector(s);q('#d6').onclick=()=>{const a=+q('#d1').value,p=+q('#d2').value,iu=+q('#d4').value,r=+q('#d5').value;let d=+q('#d3').value,rows='';
  if(p<a){q('#d7').innerHTML='<div class="note">Usia pensiun harus lebih besar atau sama dengan usia sekarang.</div>';return}
  for(let i=1;i<=p-a;i++){d=(d+iu*12)*(1+r/100);rows+=`<tr><td>${i}</td><td>${a+i}</td><td>${Math.round(d).toLocaleString('id-ID')}</td></tr>`}
  q('#d7').innerHTML=`<p>Proyeksi dana pensiun Anda adalah:</p><div class="big">Rp ${d.toLocaleString('id-ID',{maximumFractionDigits:2})}</div><details><summary>Tabel per tahun</summary><table><tr><th>Tahun ke</th><th>Usia</th><th>Dana</th></tr>${rows}</table></details>`}};
W.wRerun=el=>{el.innerHTML=`<b>Simulator Rerun Model</b><p class="sub">Klik tombol beberapa kali dan bandingkan dua versi kode.</p><button class="btn" id="rb">Klik Saya!</button> <button class="btn g" id="rr">Reset sesi</button>
<div class="two" style="margin-top:12px"><div><b>Tanpa session_state</b><div class="big" id="r1">0</div><small>clicks = 0 di-reset tiap rerun</small></div><div><b>Dengan session_state</b><div class="big" id="r2">0</div><small>nilai bertahan antar rerun</small></div></div><pre class="out" id="rl" style="color:var(--mut);max-height:150px;overflow:auto"></pre>`;
 const q=s=>el.querySelector(s);let ses=0,n=0;const log=[];
 q('#rb').onclick=()=>{n++;ses++;q('#r1').textContent=1;q('#r2').textContent=ses;log.unshift(`Rerun #${n}: clicks=0 -> tombol True -> clicks=1 | session_state: ${ses-1} -> ${ses}`);q('#rl').textContent=log.join('\n')};
 q('#rr').onclick=()=>{ses=0;n=0;log.length=0;q('#r1').textContent=0;q('#r2').textContent=0;q('#rl').textContent=''}};
const h=+location.hash.slice(1);show(S[h]?h:0);
</script>
