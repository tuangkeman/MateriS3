<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="color-scheme" content="light dark">
<title>Ringkasan ALSD - 7 Modul & Analisis Mendalam Python</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --acc2: #06b6d4;
  --line: #e2e8f0;
  --ok: #10b981;
  --cbg: #0f172a;
  --cfg: #f8fafc;
  --warn: #fffbeb;
  --warnl: #f59e0b;
  --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
  --top: 60px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d16;
    --card: #131b2e;
    --ink: #f1f5f9;
    --mut: #94a3b8;
    --acc: #6366f1;
    --acc-hover: #818cf8;
    --acc2: #2dd4bf;
    --line: #1e293b;
    --ok: #34d399;
    --warn: #241a08;
    --warnl: #d97706;
    --sh: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #090d16;
  --card: #131b2e;
  --ink: #f1f5f9;
  --mut: #94a3b8;
  --acc: #6366f1;
  --acc-hover: #818cf8;
  --acc2: #2dd4bf;
  --line: #1e293b;
  --ok: #34d399;
  --warn: #241a08;
  --warnl: #d97706;
  --sh: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  font: 15.5px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-wrap: anywhere;
  background: radial-gradient(1000px 600px at 85% -10%, rgba(79, 70, 229, 0.12), transparent 70%),
              radial-gradient(800px 500px at -10% 20%, rgba(6, 182, 212, 0.08), transparent 70%),
              var(--bg);
  background-attachment: fixed;
}

body.nav-open {
  overflow: hidden;
}

.prog {
  position: fixed;
  left: 0;
  top: 0;
  height: 3px;
  width: 100%;
  z-index: 100;
  background: linear-gradient(90deg, var(--acc), var(--acc2));
  transform-origin: left;
  transform: scaleX(0);
}

.top {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

.brand {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ib {
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s;
}

.ib:active {
  transform: scale(0.92);
}

.ib:hover {
  background: var(--line);
}

.mi {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: linear-gradient(90deg, currentColor 50%, transparent 50%);
}

.app {
  display: flex;
  max-width: 1260px;
  margin: 0 auto;
}

#nav {
  width: 280px;
  flex: none;
  position: sticky;
  top: calc(var(--top) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top));
  height: calc(100dvh - var(--top));
  overflow-y: auto;
  padding: 16px 12px 30px;
  overscroll-behavior: contain;
}

.nh {
  display: flex;
  flex-direction: column;
  padding: 4px 8px 16px;
  position: relative;
}

.nh b {
  font-size: 17px;
}

.nh small {
  color: var(--mut);
  font-size: 13px;
}

.nh .x {
  display: none;
  position: absolute;
  right: 0;
  top: 0;
}

.ni {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin: 4px 0;
  padding: 10px 12px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 14.5px;
  text-align: left;
  cursor: pointer;
  min-height: 48px;
  transition: all 0.2s ease;
}

.ni:hover {
  background: var(--line);
  transform: translateX(3px);
}

.ni .num {
  width: 28px;
  height: 28px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--line);
  font-weight: 700;
  font-size: 13px;
  transition: all 0.25s ease;
}

.ni .nt {
  flex: 1;
  min-width: 0;
  line-height: 1.3;
}

.ni small {
  color: var(--mut);
  font-size: 11.5px;
  display: block;
}

.ni.on {
  background: var(--card);
  box-shadow: var(--sh);
  font-weight: 600;
}

.ni.on .num {
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  color: #fff;
  transform: scale(1.08) rotate(-4deg);
}

.ov {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

main {
  flex: 1;
  min-width: 0;
  padding: 20px clamp(14px, 4vw, 36px) calc(100px + env(safe-area-inset-bottom, 0px));
}

.page {
  animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  padding: clamp(24px, 5vw, 40px);
  color: #ffffff;
  background: linear-gradient(135deg, #4f46e5, #7c3aed, #06b6d4);
  background-size: 200% 200%;
  animation: gradientFlow 12s ease infinite;
  box-shadow: var(--sh);
}

.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  animation: floatAnim 8s ease-in-out infinite;
}

.hero::before {
  width: 220px;
  height: 220px;
  right: -60px;
  top: -80px;
}

.hero::after {
  width: 140px;
  height: 140px;
  right: 100px;
  bottom: -60px;
  animation-delay: -4s;
}

.hero .no {
  position: absolute;
  right: 20px;
  bottom: -20px;
  font-size: clamp(100px, 22vw, 160px);
  font-weight: 900;
  line-height: 1;
  opacity: 0.15;
  user-select: none;
  pointer-events: none;
}

.hero h2 {
  position: relative;
  margin: 0 0 8px;
  font-size: clamp(22px, 5vw, 32px);
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.hero p {
  position: relative;
  margin: 0 0 16px;
  max-width: 600px;
  opacity: 0.92;
  font-size: 15px;
}

.chips {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chips span {
  padding: 4px 12px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.2);
  font-size: 12.5px;
  font-weight: 500;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

.toc {
  position: sticky;
  top: calc(var(--top) + env(safe-area-inset-top, 0px));
  z-index: 30;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 16px -4px 0;
  padding: 10px 4px;
  scrollbar-width: none;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

.toc::-webkit-scrollbar {
  display: none;
}

.toc button {
  flex: none;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 6px 14px;
  min-height: 36px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.toc button:hover {
  border-color: var(--acc);
  color: var(--acc);
  transform: translateY(-1px);
}

h3.h {
  margin: 28px 0 12px;
  font-size: 20px;
  letter-spacing: -0.01em;
}

.tag {
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 6px;
  color: #fff;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  margin-right: 8px;
  vertical-align: middle;
}

.sub {
  color: var(--mut);
  margin: 0 0 12px;
  font-size: 14.5px;
}

.blk {
  margin: 28px 0;
  scroll-margin-top: calc(var(--top) + 60px);
}

.sum {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}

.sum li {
  position: relative;
  padding: 12px 16px 12px 42px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--sh);
}

.sum li::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 20px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
}

code {
  font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  background: color-mix(in srgb, var(--line) 60%, transparent);
  padding: 2px 6px;
  border-radius: 6px;
  color: var(--ink);
}

.rv {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.rv.in {
  opacity: 1;
  transform: none;
}

.cell {
  border-radius: 16px;
  overflow: hidden;
  background: var(--cbg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: var(--sh);
  margin: 12px 0 16px;
}

.cell.ak {
  border-left: 4px solid var(--ok);
}

.ch {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: #161e2e;
  color: #94a3b8;
  font-size: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.ch i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ff5f56;
}

.ch i:nth-child(2) { background: #ffbd2e; }
.ch i:nth-child(3) { background: #27c93f; }

.ch span {
  flex: 1;
  margin-left: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ch button {
  padding: 4px 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  background: transparent;
  color: #cbd5e1;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}

.ch button:hover {
  background: rgba(255, 255, 255, 0.1);
}

.cell textarea {
  display: block;
  width: 100%;
  max-height: 60vh;
  border: 0;
  background: transparent;
  color: var(--cfg);
  font: 13.5px/1.6 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  padding: 14px 16px;
  resize: vertical;
  white-space: pre;
  overflow: auto;
  tab-size: 4;
  outline: 0;
}

.bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 10px 14px;
  background: #161e2e;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.bar > span {
  color: #94a3b8;
  font-size: 12.5px;
}

.run, .bar .g {
  min-height: 38px;
  padding: 6px 16px;
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, filter 0.2s;
}

.run {
  border: 0;
  color: #fff;
  background: linear-gradient(135deg, var(--acc), #6366f1);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.run:hover { filter: brightness(1.1); }
.run:active { transform: scale(0.96); }

.run.busy {
  opacity: 0.8;
  pointer-events: none;
}

.run.busy::before {
  content: "";
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 6px;
  border: 2px solid #fff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.bar .g {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #cbd5e1;
}

.out {
  margin: 0;
  padding: 14px 16px;
  background: #090d16;
  color: #34d399;
  border-top: 1px dashed rgba(255, 255, 255, 0.1);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
  white-space: pre-wrap;
  overflow-x: auto;
}

.out:empty { display: none; }
.out.err { color: #f87171; }

.tw {
  overflow-x: auto;
  margin: 10px 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--sh);
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}

th, td {
  padding: 10px 14px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}

th {
  background: color-mix(in srgb, var(--line) 40%, transparent);
  font-weight: 600;
}

tr:last-child td { border-bottom: 0; }

.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 4px solid var(--acc);
  border-radius: 16px;
  padding: 18px;
  margin: 20px 0;
  box-shadow: var(--sh);
}

.loop-box {
  background: color-mix(in srgb, var(--acc2) 8%, var(--card));
  border: 1px solid color-mix(in srgb, var(--acc2) 30%, transparent);
  border-left: 4px solid var(--acc2);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 12px 0;
}

.loop-box h4 {
  margin: 0 0 6px;
  font-size: 14.5px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 10px 0;
}

input, select {
  font: inherit;
  font-size: 14.5px;
  min-height: 40px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}

input[type="range"] {
  accent-color: var(--acc);
  padding: 0;
}

.btn {
  min-height: 40px;
  padding: 8px 18px;
  border: 0;
  border-radius: 10px;
  background: var(--acc);
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, filter 0.2s;
}

.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(0.96); }

.btn.g {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}

.big {
  font-size: clamp(24px, 6vw, 32px);
  font-weight: 800;
  color: var(--acc);
}

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.two > div {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
}

.bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 180px;
  padding: 12px 8px 0;
  margin: 12px 0;
  background: var(--bg);
  border-radius: 12px;
}

.bars div {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 4px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--mut);
  opacity: 0.6;
  border-radius: 6px 6px 0 0;
  transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s, opacity 0.2s;
}

.bars div.h { background: var(--acc); opacity: 1; }
.bars div.d { background: var(--ok); opacity: 1; }

.pager {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 40px;
}

.pager button {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  min-height: 64px;
  transition: all 0.2s ease;
}

.pager button:hover {
  transform: translateY(-2px);
  border-color: var(--acc);
  box-shadow: var(--sh);
}

.pager small { color: var(--mut); }
.pager b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .nx { grid-column: 2; text-align: right; }

.fab {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  box-shadow: var(--sh);
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.fab.show {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

@keyframes gradientFlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes floatAnim {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 959px) {
  #nav {
    position: fixed;
    z-index: 60;
    left: 0;
    top: 0;
    bottom: 0;
    width: min(85vw, 300px);
    height: 100%;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 30px;
    background: var(--card);
    box-shadow: var(--sh);
    transform: translateX(-105%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .nh .x { display: grid; }
  body.nav-open #nav { transform: none; }
  body.nav-open .ov { opacity: 1; pointer-events: auto; }
}

@media (max-width: 640px) {
  body { font-size: 15px; }
  .two { grid-template-columns: 1fr; }
  .pager { grid-template-columns: 1fr; }
  .pager .nx { grid-column: 1; }
  th, td { padding: 8px 10px; font-size: 13.5px; }
  .cell textarea, .out { font-size: 12.5px; }
}
</style>
</head>
<body>

<div class="prog" id="pg"></div>

<header class="top">
  <button class="ib menu" id="mb" aria-label="Buka Menu">&#9776;</button>
  <div class="brand" id="br">Ringkasan ALSD</div>
  <button class="ib" id="tb" aria-label="Ganti Tema"><span class="mi"></span></button>
</header>

<div class="app">
  <aside id="nav" aria-label="Navigasi Utama"></aside>
  <main id="main"></main>
</div>

<div class="ov" id="ov"></div>
<button class="fab" id="fb" aria-label="Kembali ke Atas">&uarr;</button>

<script>
const R = String.raw;
const B = (t, d, k, p, run = true, loopExplanation = null) => ({ t, d, k, p, run, loopExplanation });
const S = [];

/* ==========================================================================
   MODUL 1: REVIEW PYTHON
   ========================================================================== */
S.push({
  n: '1. Review Python',
  h: 'Modul 1 - Review Dasar Python & Lingkungan Kerja',
  s: 'Ulasan dasar sintaksis Python, variabel, tipe data, kondisi, perulangan, dan fungsi.',
  r: [

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

let py = null, cur = -1;

function loadPy() {
  return new Promise((ok, no) => {
    if (window.loadPyodide) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    s.onload = ok;
    s.onerror = () => no(new Error('Gagal memuat engine Python Pyodide. Pastikan koneksi internet aktif.'));
    document.head.appendChild(s);
  });
}

async function run(code, out, st, btn) {
  out.className = 'out';
  out.textContent = '';
  let buf = '', err = false;
  btn.classList.add('busy');
  try {
    if (!py) {
      st.textContent = 'Memuat Pyodide Engine (~10 MB)...';
      await loadPy();
      py = await loadPyodide();
    }
    st.textContent = 'Mengeksekusi...';
    py.setStdout({ batched: s => buf += s + '\n' });
    py.setStderr({ batched: s => buf += s + '\n' });
    const g = py.toPy({});
    await py.runPythonAsync(code, { globals: g });
    g.destroy();
    out.textContent = buf || '(Selesai tanpa output)';
  } catch (e) {
    err = true;
    out.textContent = buf + String(e.message || e).split('\n').slice(-8).join('\n');
  }
  st.textContent = '';
  btn.classList.remove('busy');
  out.className = 'out show' + (err ? ' err' : '');
}

function mk(t, c, h) {
  const e = document.createElement(t);
  if (c) e.className = c;
  if (h != null) e.innerHTML = h;
  return e;
}

function cell(b) {
  const d = mk('div', 'cell' + (b.t.startsWith('Akses') ? ' ak' : ''));
  const ta = mk('textarea');
  ta.value = b.k;
  ta.spellcheck = false;
  ta.setAttribute('autocapitalize', 'off');
  ta.setAttribute('autocorrect', 'off');
  ta.rows = Math.min(b.k.split('\n').length + 1, 22);

  ta.onkeydown = e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end');
    }
  };

  const ch = mk('div', 'ch', '<i></i><i></i><i></i><span>Python Code Editor</span>');
  const cp = mk('button', '', 'Salin Kode');
  cp.onclick = async () => {
    try {
      await navigator.clipboard.writeText(ta.value);
    } catch (e) {
      ta.select();
      document.execCommand('copy');
    }
    cp.textContent = 'Tersalin!';
    setTimeout(() => cp.textContent = 'Salin Kode', 1500);
  };
  ch.append(cp);
  d.append(ch, ta);

  if (b.run) {
    const o = mk('pre', 'out');
    const st = mk('span');
    const bar = mk('div', 'bar');
    const r = mk('button', 'run', 'Jalankan');
    const rs = mk('button', 'g', 'Reset Kode');

    r.onclick = () => run(ta.value, o, st, r);
    rs.onclick = () => {
      ta.value = b.k;
      o.textContent = '';
      o.className = 'out';
    };

    bar.append(r, rs, st);
    d.append(bar, o);
  }
  return d;
}

function block(b, k) {
  const s = mk('section', 'blk rv');
  s.id = 'b' + k;
  const ak = b.t.startsWith('Akses data:');
  s.innerHTML = `<h3>${ak ? '<em class="tag">akses data</em>' : ''}${esc(ak ? b.t.slice(12) : b.t)}</h3><p class="sub">${b.d}</p>`;
  s.append(cell(b));

  if (b.p && b.p.length) {
    s.append(mk('div', 'tw', '<table><tr><th>Sintaksis / Variabel</th><th>Penjelasan Fungsi</th></tr>' +
      b.p.map(x => `<tr><td><code>${esc(x[0])}</code></td><td>${x[1]}</td></tr>`).join('') + '</table>'));
  }

  if (b.loopExplanation) {
    const lb = mk('div', 'loop-box');
    let html = `<h4>🔄 ${esc(b.loopExplanation.title)}</h4>`;
    html += '<ul style="margin:6px 0 0; padding-left:20px; font-size:13.5px; color:var(--ink);">';
    b.loopExplanation.details.forEach(item => {
      html += `<li style="margin-bottom:6px;">${item}</li>`;
    });
    html += '</ul>';
    lb.innerHTML = html;
    s.append(lb);
  }

  return s;
}

const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    e.target.classList.add('in');
    io.unobserve(e.target);
  }
}), { rootMargin: '0px 0px -5% 0px', threshold: 0.02 }) : null;

const openNav = () => document.body.classList.add('nav-open');
const closeNav = () => document.body.classList.remove('nav-open');

function show(i) {
  cur = i;
  const m = S[i];
  document.querySelectorAll('.ni').forEach((b, j) => b.classList.toggle('on', j === i));
  closeNav();
  $('#br').textContent = m.n;

  const nk = m.b.filter(x => x.run).length;
  const M = $('#main');

  M.innerHTML = `
    <div class="page">
      <header class="hero">
        <div class="no">${i + 1}</div>
        <h2>${m.h.replace(/^Modul \d+ - /, '')}</h2>
        <p>${m.s}</p>
        <div class="chips">
          <span>Modul ${i + 1} dari ${S.length}</span>
          <span>${m.r.length} Poin Ringkasan</span>
          <span>${nk} Interaktif Code</span>
        </div>
      </header>
      <div class="toc"></div>
      <h3 class="h">Ringkasan Konsep Kunci</h3>
      <ul class="sum">${m.r.map((x, j) => `<li class="rv" style="transition-delay:${j * 60}ms">${x}</li>`).join('')}</ul>
      <div id="wd"></div>
      <div id="bl"></div>
      <div class="pager"></div>
    </div>
  `;

  m.b.forEach((b, k) => {
    const a = mk('button', '', (k + 1) + '. ' + esc(b.t));
    a.onclick = () => document.getElementById('b' + k).scrollIntoView({ behavior: 'smooth', block: 'start' });
    M.querySelector('.toc').append(a);
  });

  if (m.w) {
    const w = mk('div', 'box rv');
    M.querySelector('#wd').append(w);
    W[m.w](w);
  }

  M.querySelector('#bl').append(...m.b.map(block));

  const pg = M.querySelector('.pager');
  if (i > 0) {
    const p = mk('button', 'pv', `<small>&larr; Sebelumnya</small><b>${esc(S[i - 1].n)}</b>`);
    p.onclick = () => show(i - 1);
    pg.append(p);
  }
  if (i < S.length - 1) {
    const n = mk('button', 'nx', `<small>Berikutnya &rarr;</small><b>${esc(S[i + 1].n)}</b>`);
    n.onclick = () => show(i + 1);
    pg.append(n);
  }

  M.querySelectorAll('.rv').forEach(e => io ? io.observe(e) : e.classList.add('in'));
  scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + i); } catch (e) {}
}

/* ==========================================================================
   INITIALIZATION & NAVIGATION BUILDER
   ========================================================================== */
const nv = $('#nav');
nv.innerHTML = '<div class="nh"><b>Ringkasan ALSD</b><small>7 Modul & Analisis Python</small><button class="ib x" aria-label="Tutup Menu">&times;</button></div>';
nv.querySelector('.x').onclick = closeNav;

S.forEach((m, i) => {
  const b = mk('button', 'ni', `
    <span class="num">${i + 1}</span>
    <span class="nt">${esc(m.n.replace(/^\d+\.\s*/, ''))}<small>${m.b.length} Topik Pembahasan</small></span>
  `);
  b.onclick = () => show(i);
  nv.append(b);
});

$('#mb').onclick = openNav;
$('#ov').onclick = closeNav;
addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(); });

$('#fb').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

let tk = 0;
addEventListener('scroll', () => {
  if (tk) return;
  tk = requestAnimationFrame(() => {
    tk = 0;
    const d = document.documentElement;
    const mx = d.scrollHeight - innerHeight;
    $('#pg').style.transform = `scaleX(${mx > 0 ? Math.min(1, scrollY / mx) : 0})`;
    $('#fb').classList.toggle('show', scrollY > 400);

}, { passive: true });

const root = document.documentElement;
const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const setTheme = t => {
  root.dataset.theme = t;
  try { localStorage.setItem('th', t); } catch (e) {}
};

try {
  const t = localStorage.getItem('th');
  if (t) setTheme(t);
} catch (e) {}

$('#tb').onclick = () => setTheme(dark() ? 'light' : 'dark');

addEventListener('hashchange', () => {
  const n = +location.hash.slice(1);
  if (S[n] && n !== cur) show(n);
});

/* ==========================================================================
   WIDGET VISUALIZER INTERAKTIF
   ========================================================================== */
const W = {};

W.wBigO = el => {
  el.innerHTML = `
    <b>Simulator Pertumbuhan Kompleksitas Big-O</b>
    <div class="row">n = <input type="range" id="bn" min="1" max="25" value="8"> <b id="bv">8</b></div>
    <table id="bt"></table>
    <small style="color:var(--mut);">Geser slider untuk melihat perbedaan laju pertumbuhan jumlah operasi.</small>
  `;
  const f = () => {
    const n = +el.querySelector('#bn').value;
    el.querySelector('#bv').textContent = n;
    const L = Math.log2(n);
    const rows = [
      ['O(1) Konstan', 1],
      ['O(log n) Logaritmik', Math.floor(L)],
      ['O(n) Linear', n],
      ['O(n log n)', Math.round(n * L)],
      ['O(n²) Kuadratik', n * n],
      ['O(2ⁿ) Eksponensial', 2 ** n]
    ];
    el.querySelector('#bt').innerHTML = '<tr><th>Notasi Big-O</th><th>Jumlah Operasi</th><th>Visualisator Grafik</th></tr>' +
      rows.map(r => `
        <tr>
          <td><b>${r[0]}</b></td>
          <td>${r[1].toLocaleString('id-ID')}</td>
          <td><div style="height:10px; border-radius:6px; background:linear-gradient(90deg, var(--acc), var(--acc2)); width:${Math.min(100, Math.max(2, (r[1] / (n * n || 1)) * 100))}%"></div></td>
        </tr>
      `).join('');
  };
  el.querySelector('#bn').oninput = f;
  f();
};

W.wSort = el => {
  el.innerHTML = `
    <b>Visualisator Animasi Sorting</b>
    <div class="row">
      <select id="sa"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="insertion">Insertion Sort</option></select>
      <button class="btn g" id="sr">Acak Data</button>
      <button class="btn" id="sp">Mulai Sort</button>
      <span id="ss" style="font-size:13px; color:var(--mut);"></span>
    </div>
    <div class="bars" id="sb"></div>
  `;
  const q = s => el.querySelector(s);
  let A = [], T = [], k = 0, tm = null;

  const steps = (al, a) => {
    a = [...a];
    const Z = [{ a: [...a], h: [] }];
    const n = a.length;
    const p = h => Z.push({ a: [...a], h });

    if (al === 'bubble') {
      for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
          p([j, j + 1]);
          if (a[j] > a[j + 1]) {
            [a[j], a[j + 1]] = [a[j + 1], a[j]];
            p([j, j + 1]);
          }
        }
      }
    } else if (al === 'selection') {
      for (let i = 0; i < n - 1; i++) {
        let m = i;
        for (let j = i + 1; j < n; j++) {
          p([m, j]);
          if (a[j] < a[m]) m = j;
        }
        [a[i], a[m]] = [a[m], a[i]];
        p([i, m]);
      }
    } else {
      for (let i = 1; i < n; i++) {
        const key = a[i];
        let j = i - 1;
        while (j >= 0 && a[j] > key) {
          a[j + 1] = a[j];
          j--;
          p([j + 1, i]);
        }
        a[j + 1] = key;
        p([j + 1]);
      }
    }
    Z.push({ a: [...a], h: [], d: 1 });
    return Z;
  };

  const draw = () => {
    const s = T[k];
    const bx = q('#sb');
    if (bx.children.length !== s.a.length) bx.innerHTML = s.a.map(() => '<div></div>').join('');
    [...bx.children].forEach((d, i) => {
      d.style.height = s.a[i] + '%';
      d.textContent = s.a[i];
      d.className = s.d ? 'd' : s.h.includes(i) ? 'h' : '';
    });
    q('#ss').textContent = `Langkah ${k + 1}/${T.length}`;
  };

  const init = () => {
    clearInterval(tm);
    q('#sp').textContent = 'Mulai Sort';
    T = steps(q('#sa').value, A);
    k = 0;
    draw();
  };

  const rnd = () => {
    A = Array.from({ length: 8 }, () => 10 + Math.floor(Math.random() * 85));
    init();
  };

  q('#sr').onclick = rnd;
  q('#sa').onchange = init;

  q('#sp').onclick = () => {
    if (tm && q('#sp').textContent === 'Jeda') {
      clearInterval(tm);
      q('#sp').textContent = 'Mulai Sort';
      return;
    }
    if (k >= T.length - 1) init();
    q('#sp').textContent = 'Jeda';
    tm = setInterval(() => {
      if (k < T.length - 1) {
        k++;
        draw();
      } else {
        clearInterval(tm);
        q('#sp').textContent = 'Mulai Sort';
      }
    }, 300);
  };

  A = [64, 34, 25, 12, 22, 11, 90, 45];
  init();
};

W.wDapen = el => {
  el.innerHTML = `
    <b>Simulator Dana Pensiun Interaktif</b>
    <div class="row">
      Usia Sekarang: <input id="d1" type="number" value="20" style="width:70px">
      Usia Pensiun: <input id="d2" type="number" value="55" style="width:70px">
    </div>
    <div class="row">
      Iuran Bulanan (Rp): <input id="d4" type="number" value="1000000" style="width:130px">
      Bunga Tahunan (%): <input id="d5" type="number" value="6" step="0.5" style="width:70px">
      <button class="btn" id="d6">Hitung</button>
    </div>
    <div id="d7"></div>
  `;
  const q = s => el.querySelector(s);
  q('#d6').onclick = () => {
    const a = +q('#d1').value, p = +q('#d2').value, iu = +q('#d4').value, r = +q('#d5').value;
    let d = 0;
    if (p <= a) {
      q('#d7').innerHTML = '<div style="color:var(--warnl); margin-top:8px;">Usia pensiun harus lebih besar dari usia sekarang!</div>';
      return;
    }
    for (let i = 1; i <= p - a; i++) {
      d = (d + iu * 12) * (1 + r / 100);
    }
    q('#d7').innerHTML = `
      <p style="margin:10px 0 2px;">Proyeksi Hasil Dana Pensiun:</p>
      <div class="big">Rp ${d.toLocaleString('id-ID', { maximumFractionDigits: 0 })}</div>
    `;
  };
};

W.wRerun = el => {
  el.innerHTML = `
    <b>Interactive State vs Local Variable Demo</b>
    <div class="row">
      <button class="btn" id="rb">Klik Simulasi Rerun</button>
      <button class="btn g" id="rr">Reset State</button>
    </div>
    <div class="two" style="margin-top:10px;">
      <div>
        <b>Variabel Lokal Biasa</b>
        <div class="big" id="r1">0</div>
        <small style="color:var(--mut);">Selalu ter-reset ke 0 tiap rerun</small>
      </div>
      <div>
        <b>Session State</b>
        <div class="big" id="r2">0</div>
        <small style="color:var(--mut);">Nilai persisten antar rerun</small>
      </div>
    </div>
  `;
  const q = s => el.querySelector(s);
  let ses = 0;
  q('#rb').onclick = () => {
    ses++;
    q('#r1').textContent = 1;
    q('#r2').textContent = ses;
  };
  q('#rr').onclick = () => {
    ses = 0;
    q('#r1').textContent = 0;
    q('#r2').textContent = 0;
  };
};

// Start application on load
const initialHash = +location.hash.slice(1);
show(S[initialHash] ? initialHash : 0);
</script>
