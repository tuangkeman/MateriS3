<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="color-scheme" content="light dark">
<title>Ringkasan ALSD - 7 Modul Praktis & Interaktif</title>
<!-- Memuat Pyodide Script dari CDN CDNJS / JsDelivr -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --cfg: #0f172a;
  --mut: #64748b;
  --acc: #6366f1;
  --acc-hover: #4f46e5;
  --line: #e2e8f0;
  --code-bg: #0f172a;
  --code-cfg: #f8fafc;
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
  --header-h: 60px;
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --card: #131b2e;
  --cfg: #f1f5f9;
  --mut: #94a3b8;
  --acc: #818cf8;
  --acc-hover: #6366f1;
  --line: #1e293b;
  --code-bg: #080c14;
  --code-cfg: #f1f5f9;
  --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--cfg);
  line-height: 1.6;
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
}

body.nav-open {
  overflow: hidden;
}

/* Header Navbar */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background-color: var(--card);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--sh);
}

.brand-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--acc);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 60vw;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--cfg);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background-color: var(--line);
}

/* Progress Bar */
.prog-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--acc), #06b6d4);
  width: 100%;
  transform-origin: left;
  transform: scaleX(0);
  z-index: 50;
  transition: transform 0.1s ease-out;
}

/* App Container */
.app-container {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  min-height: calc(100vh - var(--header-h));
}

/* Sidebar Drawer */
#sidebar {
  width: 280px;
  background-color: var(--card);
  border-right: 1px solid var(--line);
  padding: 20px 12px;
  flex-shrink: 0;
  transition: transform 0.3s ease;
}

@media (max-width: 868px) {
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
    box-shadow: var(--sh);
    width: 80vw;
    max-width: 300px;
  }
  body.nav-open #sidebar {
    transform: translateX(0);
  }
}

.nav-header {
  margin-bottom: 20px;
  padding: 0 8px;
}

.nav-header h2 {
  font-size: 1.2rem;
  color: var(--acc);
}

.nav-header small {
  color: var(--mut);
}

.nav-item {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 12px;
  margin-bottom: 6px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: none;
  color: var(--cfg);
  font-size: 0.95rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-item:hover {
  background-color: var(--line);
}

.nav-item.active {
  background-color: rgba(99, 102, 241, 0.1);
  border-color: var(--acc);
  color: var(--acc);
  font-weight: 600;
}

.nav-num {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background-color: var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  margin-right: 12px;
  flex-shrink: 0;
}

.nav-item.active .nav-num {
  background-color: var(--acc);
  color: #fff;
}

/* Overlay for Mobile Nav */
.overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

body.nav-open .overlay {
  opacity: 1;
  pointer-events: auto;
}

/* Main Content Area */
#mainContent {
  flex: 1;
  padding: 24px 20px 80px;
  min-width: 0;
}

/* Hero Box */
.hero {
  position: relative;
  background: linear-gradient(135deg, var(--acc), #4338ca);
  color: white;
  padding: 28px;
  border-radius: 20px;
  margin-bottom: 24px;
  overflow: hidden;
  box-shadow: var(--sh);
}

.hero-bg-num {
  position: absolute;
  right: -10px;
  bottom: -20px;
  font-size: 8rem;
  font-weight: 900;
  opacity: 0.15;
  line-height: 1;
}

.hero h1 {
  font-size: 1.6rem;
  margin-bottom: 8px;
  line-height: 1.3;
}

.hero p {
  font-size: 0.95rem;
  opacity: 0.9;
  margin-bottom: 16px;
  max-width: 600px;
}

.hero-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.badge {
  background-color: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(4px);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
}

/* Summary Box */
.summary-box {
  background-color: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--sh);
}

.summary-box h3 {
  font-size: 1.1rem;
  margin-bottom: 12px;
  color: var(--acc);
}

.summary-list {
  list-style-type: none;
}

.summary-list li {
  position: relative;
  padding-left: 24px;
  margin-bottom: 8px;
  font-size: 0.95rem;
}

.summary-list li::before {
  content: "•";
  position: absolute;
  left: 8px;
  color: var(--acc);
  font-size: 1.4rem;
  line-height: 1;
}

/* Interactive Code Cells (DIPERBESAR AGAR LEGA) */
.code-cell {
  background-color: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  margin-bottom: 28px;
  overflow: hidden;
  box-shadow: var(--sh);
}

.cell-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background-color: rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.cell-dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.dot-red { background-color: #ef4444; }
.dot-yellow { background-color: #f59e0b; }
.dot-green { background-color: #10b981; }

.cell-title {
  color: #94a3b8;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: monospace;
}

/* Area Ketik Dibuat Sangat Luas dan Nyaman */
textarea.code-editor {
  width: 100%;
  min-height: 350px; /* Ukuran kotak diperbesar dari 220px ke 350px */
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--code-cfg);
  font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
  font-size: 1.05rem; /* Font diperbesar agar nyaman dibaca */
  line-height: 1.6;
  padding: 20px;
  resize: vertical;
  tab-size: 4;
  -webkit-overflow-scrolling: touch;
}

.cell-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background-color: rgba(0, 0, 0, 0.2);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.run-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background-color: var(--acc);
  color: white;
  border: none;
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
}

.run-btn:hover {
  background-color: var(--acc-hover);
}

.run-btn:active {
  transform: scale(0.97);
}

.run-btn.busy {
  opacity: 0.7;
  pointer-events: none;
}

.cell-status {
  font-size: 0.85rem;
  color: #94a3b8;
}

.console-out {
  padding: 18px;
  background-color: rgba(0, 0, 0, 0.4);
  color: #38bdf8;
  font-family: monospace;
  font-size: 0.95rem;
  white-space: pre-wrap;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  max-height: 350px;
  overflow-y: auto;
}

.console-out:empty {
  display: none;
}

.console-out.err {
  color: #f87171;
}

/* Penjelasan Santai & Sederhana */
.deep-explain {
  background-color: var(--card);
  padding: 22px;
  border-top: 1px solid var(--line);
  color: var(--cfg);
}

.deep-explain h4 {
  font-size: 1.05rem;
  color: var(--acc);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.deep-explain p {
  font-size: 0.95rem;
  margin-bottom: 14px;
  color: var(--cfg);
  line-height: 1.7;
}

.loop-trace-box {
  background-color: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  margin: 16px 0;
  font-size: 0.9rem;
  overflow-x: auto;
}

.loop-trace-title {
  font-weight: 700;
  color: var(--acc);
  margin-bottom: 8px;
}

/* Syntax Tables */
.syntax-table-wrapper {
  overflow-x: auto;
  margin-top: 14px;
}

.syntax-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.syntax-table th, .syntax-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}

.syntax-table th {
  background-color: rgba(99, 102, 241, 0.08);
  color: var(--acc);
  font-weight: 600;
}

.mini-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #94a3b8;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
}

.mini-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: white;
}

/* Widgets */
.widget-card {
  background-color: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--sh);
}

.widget-card h3 {
  font-size: 1.1rem;
  color: var(--acc);
  margin-bottom: 12px;
}

.bars-visualizer {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 180px;
  padding: 10px;
  background-color: var(--bg);
  border-radius: 12px;
  margin-top: 12px;
}

.bar-item {
  flex: 1;
  background-color: var(--acc);
  border-radius: 6px 6px 0 0;
  transition: height 0.3s ease, background-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.75rem;
  font-weight: 700;
}

.bar-item.active { background-color: var(--warn); }
.bar-item.done { background-color: var(--ok); }

/* Pagination Buttons */
.page-nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 40px;
}

.pager-card {
  flex: 1;
  padding: 16px;
  background-color: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.2s, transform 0.2s;
  text-decoration: none;
  color: inherit;
}

.pager-card:hover {
  border-color: var(--acc);
  transform: translateY(-2px);
}

.pager-card.next {
  text-align: right;
}

.pager-label {
  font-size: 0.75rem;
  color: var(--mut);
  display: block;
}

.pager-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--acc);
}

/* FAB Top */
.fab-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: var(--acc);
  color: white;
  border: none;
  box-shadow: var(--sh);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s, transform 0.3s;
  z-index: 30;
}

.fab-top.show {
  opacity: 1;
  transform: translateY(0);
}

/* Keyframe Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fade-up {
  animation: fadeUp 0.4s ease-out forwards;
}
</style>
</head>

<div class="prog-bar" id="progBar"></div>

<header class="header">
  <button class="icon-btn" id="btnToggleNav" aria-label="Buka Menu">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand-title" id="headerTitle">Ringkasan ALSD</div>
  <button class="icon-btn" id="btnTheme" aria-label="Ganti Tema">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  </button>
</header>

<div class="app-container">
  <aside id="sidebar"></aside>
  <main id="mainContent"></main>
</div>

<div class="overlay" id="navOverlay"></div>
<button class="fab-top" id="btnFabTop" aria-label="Kembali ke Atas">&uarr;</button>

<script>
// RAW STRING HELPER
const R = String.raw;

// DATABASE 7 MODUL ALSD DENGAN BAHASA SIMPEL DAN TIDAK BERBELIT-BELIT
const modulesData = [
  {
    id: 1,
    title: "1. Review Python & Dasar",
    heading: "Modul 1 - Pemrograman Dasar Python",
    sub: "Pengenalan variabel, pengondisian (if-else), dan perulangan (loop).",
    summary: [
      "<b>Variabel</b>: Wadah tempat kita menyimpan data (seperti angka atau teks).",
      "<b>Percabangan (if-else)</b>: Cara komputer mengambil keputusan berdasarkan kondisi.",
      "<b>Perulangan (for/while)</b>: Cara menyuruh komputer melakukan hal yang sama berkali-kali tanpa capek mengetik ulang."
    ],
    codes: [
      {
        title: "Variabel & Tipe Data",
        desc: "Contoh cara menyimpan data teks, angka bulat, desimal, dan status benar/salah.",
        code: R`nama = "Andi"       # Teks (String)
umur = 20           # Angka Bulat (Integer)
ipk = 3.85          # Angka Desimal (Float)
aktif = True        # Status Benar/Salah (Boolean)

print("Nama :", nama)
print("Umur :", umur)
print("IPK  :", ipk)
print("Aktif:", aktif)`,
        explain: "Di sini kita membuat 4 buah wadah (variabel). Komputer otomatis tahu jenis data apa yang kita masukkan tanpa perlu kita beri tahu secara rumit.",
        syntax: [
          ["nama = 'Andi'", "Membuat variabel bernama 'nama' yang isinya teks 'Andi'"],
          ["print()", "Perintah untuk menampilkan isi variabel ke layar"]
        ]
      },
      {
        title: "Percabangan (If - Elif - Else)",
        desc: "Menentukan nilai huruf berdasarkan angka yang didapat.",
        code: R`nilai = 82

if nilai >= 85:
    grade = 'A'
elif nilai >= 70:
    grade = 'B'
elif nilai >= 55:
    grade = 'C'
else:
    grade = 'D'

print("Nilai:", nilai, "| Grade:", grade)`,
        explain: "Komputer mengecek syarat dari atas ke bawah. Karena angka 82 lebih besar dari 70, komputer langsung menetapkan Grade 'B' dan mengebaikan syarat di bawahnya.",
        syntax: [
          ["if / elif / else", "Pilihan bercabang. Jika kondisi A pas, jalankan A. Kalau tidak, cek kondisi B."],
          ["nilai >= 70", "Syarat: Apakah nilai lebih besar atau sama dengan 70?"]
        ]
      }
    ]
  },
  {
    id: 2,
    title: "2. Big-O & Rekursif",
    heading: "Modul 2 - Ketahanan Algoritma & Rekursi",
    sub: "Mengukur seberapa cepat kode kita dan cara fungsi memanggil dirinya sendiri.",
    summary: [
      "<b>Big-O</b>: Alat untuk mengukur seberapa lambat kode kita saat data yang diolah makin banyak.",
      "<b>Rekursi</b>: Fungsi unik yang memanggil dirinya sendiri sampai syarat berhenti (Base Case) terpenuhi."
    ],
    widget: "BigO",
    codes: [
      {
        title: "Fungsi Rekursif Sederhana (Faktorial)",
        desc: "Menghitung faktorial (contoh: 5! = 5 x 4 x 3 x 2 x 1).",
        code: R`def faktorial(n):
    # Stop jika n sudah 1 atau kurang (Base Case)
    if n <= 1:
        return 1
    
    # Panggil fungsi ini lagi dengan n yang dikurangi 1
    return n * faktorial(n - 1)

print("Hasil 5! adalah:", faktorial(5))`,
        explain: "Fungsi ini terus mengalikan angka dengan angka di bawahnya secara berulang sampai menyentuh angka 1.",
        syntax: [
          ["if n <= 1:", "Rem/Rem darurat (Base Case) supaya fungsi tidak berjalan tanpa henti"],
          ["faktorial(n - 1)", "Pemanggilan ulang fungsi dengan nilai yang makin kecil"]
        ]
      }
    ]
  },
  {
    id: 3,
    title: "3. Sorting Iteratif",
    heading: "Modul 3 - Mengurutkan Data Sederhana",
    sub: "Metode Bubble Sort untuk mengurutkan angka dari kecil ke besar.",
    summary: [
      "<b>Bubble Sort</b>: Mengurutkan data dengan cara membandingkan dua angka bersebelahan. Jika posisi terbalik, tukar tempatnya. Ulangi terus sampai rapi."
    ],
    widget: "Sort",
    codes: [
      {
        title: "Bubble Sort",
        desc: "Mengurutkan deretan angka secara otomatis.",
        code: R`def bubble_sort(arr):
    n = len(arr)
    for i in range(n - 1):
        for j in range(0, n - i - 1):
            # Jika angka sebelah kiri lebih besar dari sebelah kanan, tukar!
            if arr[j] > arr[j + 1]:
                arr[j], arr[j + 1] = arr[j + 1], arr[j]
    return arr

angka = [64, 34, 25, 12, 22]
print("Sebelum:", angka)
print("Sesudah:", bubble_sort(angka.copy()))`,
        explain: "Mirip seperti gelembung air yang naik ke atas, angka yang paling besar secara bertahap akan digeser ke posisi paling kanan pada setiap putaran.",
        syntax: [
          ["arr[j], arr[j+1] = arr[j+1], arr[j]", "Trik cepat di Python untuk saling menukar dua nilai variabel"]
        ]
      }
    ]
  },
  {
    id: 4,
    title: "4. Merge & Quick Sort",
    heading: "Modul 4 - Pengurutan Cepat (Divide & Conquer)",
    sub: "Metode Quick Sort yang memecah masalah besar menjadi bagian-bagian kecil.",
    summary: [
      "<b>Divide & Conquer</b>: Strategi membagi data jadi kelompok kecil agar lebih cepat diselesaikan.",
      "<b>Quick Sort</b>: Pilih satu angka patokan (Pivot), pisahkan angka yang lebih kecil ke kiri dan yang lebih besar ke kanan."
    ],
    codes: [
      {
        title: "Quick Sort Ringkas",
        desc: "Mengurutkan daftar angka dengan sangat cepat.",
        code: R`def quick_sort(arr):
    if len(arr) <= 1:
        return arr
    
    # Ambil angka tengah sebagai patokan (Pivot)
    pivot = arr[len(arr) // 2]
    
    # Kelompokkan angka
    kiri = [x for x in arr if x < pivot]      # Angka lebih kecil dari pivot
    tengah = [x for x in arr if x == pivot]   # Angka yang sama dengan pivot
    kanan = [x for x in arr if x > pivot]     # Angka lebih besar dari pivot
    
    return quick_sort(kiri) + tengah + quick_sort(kanan)

data = [29, 10, 14, 37, 20, 7]
print("Hasil Quick Sort:", quick_sort(data))`,
        explain: "Dengan membagi angka ke dalam 3 kelompok kecil (Kiri, Tengah, Kanan), pengurutan jadi jauh lebih cepat dibandingkan membandingkan satu per satu secara manual.",
        syntax: [
          ["pivot", "Angka patokan untuk memisahkan deretan angka"],
          ["quick_sort(kiri) + ...", "Menggabungkan kembali kelompok yang sudah rapi"]
        ]
      }
    ]
  },

// INTEGRASI PYODIDE
let pyodideInstance = null;

async function initPyodide() {
  if (pyodideInstance) return pyodideInstance;
  if (typeof loadPyodide === "function") {
    pyodideInstance = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
    });
    return pyodideInstance;
  } else {
    throw new Error("Library Pyodide gagal dimuat. Pastikan koneksi internet aktif.");
  }
}

async function runPythonCode(code, outElement, statusElement, btnElement) {
  outElement.className = "console-out";
  outElement.textContent = "";
  statusElement.textContent = "Menyiapkan Python...";
  btnElement.classList.add("busy");

  try {
    const py = await initPyodide();
    statusElement.textContent = "Menjalankan Kode...";
    
    let stdoutBuffer = "";
    py.setStdout({ batched: str => stdoutBuffer += str + "\n" });
    py.setStderr({ batched: str => stdoutBuffer += str + "\n" });

    await py.runPythonAsync(code);
    outElement.textContent = stdoutBuffer.trim() || "(Kode berhasil dijalankan tanpa ada tulisan output)";
    statusElement.textContent = "Selesai";
  } catch (err) {
    outElement.className = "console-out err";
    outElement.textContent = String(err.message || err);
    statusElement.textContent = "Ada Error";
  } finally {
    btnElement.classList.remove("busy");
  }
}

      <div class="cell-toolbar">
        <button class="run-btn" onclick="executeCodeCell(${cIdx}, event)">
          <span>&#9654; Jalankan Kode</span>
        </button>
        <span class="cell-status" id="status_${cIdx}">Siap</span>

function executeCodeCell(cIdx, evt) {
  const code = document.getElementById(`code_${cIdx}`).value;

  const btn = evt.currentTarget;
  runPythonCode(code, out, status, btn);
}

function copyCode(id) {
  const area = document.getElementById(id);
  navigator.clipboard.writeText(area.value);
  alert("Kode berhasil disalin!");
}

function switchModule(idx) {
  closeNav();

  renderContent(idx);
}

// WIDGET INTERAKTIF
function renderBigOWidget() {
  return `
    <div class="widget-card">
      <h3>Visualisasi Kecepatan Algoritma (Big-O)</h3>
      <p style="font-size:0.9rem; color:var(--mut);">Geser nilai N untuk melihat seberapa berat beban kerja komputer.</p>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
        <label>Jumlah Data (N): <b id="valN">10</b></label>
        <input type="range" id="rangeN" min="1" max="20" value="10" style="flex:1;">
      </div>
      <div id="tableBigO"></div>
    </div>
  `;
}

function initBigOWidget() {
  const range = document.getElementById("rangeN");
  const valN = document.getElementById("valN");
  const table = document.getElementById("tableBigO");

  const update = () => {
    const n = parseInt(range.value);
    valN.textContent = n;
    const logN = Math.floor(Math.log2(n));
    const n2 = n * n;
    const pow2 = Math.pow(2, n);

    table.innerHTML = `
      <div class="syntax-table-wrapper">
        <table class="syntax-table">
          <tr><th>Jenis Kecepatan</th><th>Jumlah Langkah Kerja</th><th>Grafik Panjang</th></tr>
          <tr><td>O(1) - Sangat Cepat</td><td>1</td><td><div style="height:8px; background:var(--ok); width:5px;"></div></td></tr>
          <tr><td>O(log n) - Cepat</td><td>${logN}</td><td><div style="height:8px; background:var(--ok); width:${logN * 5}px;"></div></td></tr>
          <tr><td>O(n) - Sedang</td><td>${n}</td><td><div style="height:8px; background:var(--acc); width:${n * 5}px;"></div></td></tr>
          <tr><td>O(n²) - Lambat</td><td>${n2}</td><td><div style="height:8px; background:var(--warn); width:${Math.min(n2, 200)}px;"></div></td></tr>
          <tr><td>O(2ⁿ) - Sangat Lambat</td><td>${pow2.toLocaleString()}</td><td><div style="height:8px; background:var(--err); width:${Math.min(pow2 / 10, 200)}px;"></div></td></tr>
        </table>
      </div>
    `;
  };
  range.oninput = update;
  update();
}

function renderSortWidget() {
  return `
    <div class="widget-card">
      <h3>Simulasi Visual Pengurutan Batang</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="mini-btn" onclick="startSortAnim()">Mulai Urutkan</button>
        <button class="mini-btn" onclick="resetSortBars()">Acak Angka</button>
      </div>
      <div class="bars-visualizer" id="barsContainer"></div>
    </div>
  `;
}

let sortBarsData = [50, 20, 80, 40, 10, 90, 30, 70, 60];
function initSortWidget() { resetSortBars(); }

function resetSortBars() {
  sortBarsData = Array.from({length: 10}, () => Math.floor(Math.random() * 85) + 10);
  drawSortBars();
}

function drawSortBars(highlights = [], doneIdx = -1) {
  const container = document.getElementById("barsContainer");
  if (!container) return;
  container.innerHTML = sortBarsData.map((val, idx) => `
    <div class="bar-item ${highlights.includes(idx) ? 'active' : ''} ${idx <= doneIdx ? 'done' : ''}" style="height:${val}%;">
      ${val}
    </div>
  `).join('');
}

async function startSortAnim() {
  let arr = [...sortBarsData];
  let n = arr.length;
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - i - 1; j++) {
      drawSortBars([j, j + 1]);
      await new Promise(r => setTimeout(r, 150));
      if (arr[j] > arr[j + 1]) {
        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
        sortBarsData = [...arr];
        drawSortBars([j, j + 1]);
        await new Promise(r => setTimeout(r, 150));
      }
    }
  }
  drawSortBars([], n);
}

        </div>
        <div style="background:var(--card); padding:12px; border-radius:12px; border:1px solid var(--line);">

let sessionStateCounter = 0;
function initRerunWidget() {
  const btn = document.getElementById("btnSimulateRerun");
  if (!btn) return;
  btn.onclick = () => {
    sessionStateCounter++;
    document.getElementById("valNormalVar").textContent = 1;
    document.getElementById("valStateVar").textContent = sessionStateCounter;
  };
}

// EVENT LISTENERS & NAVIGATION
function setupEvents() {
  document.getElementById("btnToggleNav").onclick = openNav;
  document.getElementById("navOverlay").onclick = closeNav;
  
  const btnTheme = document.getElementById("btnTheme");
  btnTheme.onclick = () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
  };

  const fab = document.getElementById("btnFabTop");
  fab.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  window.onscroll = () => {
    const totalH = document.documentElement.scrollHeight - window.innerHeight;
    const progress = totalH > 0 ? window.scrollY / totalH : 0;
    document.getElementById("progBar").style.transform = `scaleX(${progress})`;
    
    if (window.scrollY > 300) fab.classList.add("show");
    else fab.classList.remove("show");
  };
}

function openNav() {
  document.body.classList.add("nav-open");
}

function closeNav() {
  document.body.classList.remove("nav-open");
}

window.onload = renderApp;
</script>
